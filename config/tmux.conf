set -g activity-action other
set -g assume-paste-time 1
# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


set -g default-command ''
set -g default-shell /usr/bin/zsh
set -g default-size 80x24
set -g destroy-unattached off
set -g detach-on-destroy on
set -g display-panes-active-colour red
set -g display-panes-colour blue
set -g display-panes-time 1000
set -g history-limit 10000
set -g key-table root
set -g lock-after-time 0
set -g lock-command "lock -np"
set -g message-command-style bg=black,fg=yellow
set -g message-line 0
set -g message-style bg=yellow,fg=black
# Let tmux handle mouse scroll/selection inside the active pane.
set -g mouse on
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=blue,bg=default"
set -g popup-border-lines rounded
set -g prefix C-a
set -g prefix2 None
set -g renumber-windows off
set -g repeat-time 500
set -g set-titles off
set -g set-titles-string "#S:#I:#W - \"#T\" #{session_alerts}"
set -g silence-action other
# Status line and notifications.
set -g bell-action any
set -g visual-bell off
set -g status on
set -g status-justify left
set -g status-position bottom
set -g update-environment[0] DISPLAY
set -g update-environment[1] KRB5CCNAME
set -g update-environment[2] SSH_ASKPASS
set -g update-environment[3] SSH_AUTH_SOCK
set -g update-environment[4] SSH_AGENT_PID
set -g update-environment[5] SSH_CONNECTION
set -g update-environment[6] WINDOWID
set -g update-environment[7] XAUTHORITY
# set -ga update-environment PATH
set -g visual-activity off
set -g visual-silence off
set -g word-separators "!\"#$%&'()*+,-./:;<=>?@[\\]^`{|}~"
setw -g mode-keys vi

set -g default-terminal "tmux-256color"
# set -ga terminal-features ",tmux:RGB"
set -ga terminal-overrides ",*:Tc"

set-option -sg escape-time 10

bind g display-popup -E -d "#{pane_current_path}" -w 75% -h 75% lazygit 
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane borders with a bit more separation/contrast.
set -g pane-border-lines heavy
set -g pane-border-style "fg=brightblack,bg=default"
set -g pane-active-border-style "fg=blue,bg=default"
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "
set -g pane-border-indicators both

# Make vi copy-mode behave more like expected vim selection/copy.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Use terminal defaults and ANSI accents instead of a separate theme.
set -g status-style "fg=default,bg=default"
set -g status-left-style "fg=#{?client_prefix,black,green},bg=#{?client_prefix,yellow,default},bold"
set -g status-right-style "fg=default,bg=default"
set -g status-left-length 100
set -g status-right-length 200
set -g status-left " #S  "
set -g status-right " CPU #{cpu_percentage} "
set -g window-status-style "fg=default,bg=default"
set -g window-status-current-style "fg=default,bg=default,reverse,bold"
set -g window-status-activity-style "fg=cyan,bg=default,bold"
set -g window-status-bell-style "fg=yellow,bg=default,bold"
set -g window-status-last-style "fg=default,bg=default"
set -g window-status-separator " "
set -g window-status-format " #I #W#F "
set -g window-status-current-format " #I #W#F "
set -g mode-style "fg=black,bg=white"
set -g menu-selected-style "fg=default,bg=default,reverse"

set -g allow-rename off
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{pane_current_command}'

# Persist/restore tmux environment
set -g @plugin 'tmux-plugins/tmux-resurrect'

# auto-save + auto-restore
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# bind-key -n C-f run-shell 'sesh connect "$(sesh list | fzf --prompt="sesh> ")"'
# bind-key -n C-f run-shell '/usr/bin/zsh -lic '\''choice=$(sesh list | fzf --prompt="sesh> "); if [[ -n $choice ]]; then sesh connect "$choice"; fi; exit 0'\'''

bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key -n C-f display-popup -E "sesh picker -i"
